[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typing-speed-test"
version = "0.1.0"
description = "Terminal-based typing speed test CLI tool. Test your WPM and accuracy."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["typing", "speed", "test", "wpm", "cli", "productivity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.scripts]
typing-test = "typing_test.cli:main"
typingspeed = "typing_test.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/typing-speed-test"
Repository = "https://github.com/Master-626/typing-speed-test"
Issue-Tracker = "https://github.com/Master-626/typing-speed-test/issues"
